name: Build Reader

on:
  push:
    branches:
      - aaron
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        platform: [x86, x64]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release ${{ matrix.platform }}
        shell: pwsh
        run: >-
          msbuild Reader.sln /m /t:Rebuild
          /p:Configuration=Release
          /p:Platform=${{ matrix.platform }}
          /p:PlatformToolset=v143
          /p:WindowsTargetPlatformVersion=10.0

      - name: Package
        shell: pwsh
        run: |
          $exe = if ('${{ matrix.platform }}' -eq 'x86') { 'Release\Reader.exe' } else { 'x64\Release\Reader.exe' }
          $name = "Reader_${{ matrix.platform }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $exe, "readme.txt" -DestinationPath "dist\$name.zip"
          echo "zip=$name.zip" >> $env:GITHUB_OUTPUT
        id: package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag --repo $env:GITHUB_REPOSITORY --title $tag --generate-notes (Get-Item dist\*.zip).FullName
